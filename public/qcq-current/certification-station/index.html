<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >
  <meta
    name="description"
    content="Quantum Certification Quest — Certification Station"
  >
  <title>QCQ — Certification Station</title>
  <link
    rel="stylesheet"
    href="./certification-station.css"
  >
</head>

<body>
  <div
    id="viewport"
    aria-label="Quantum Certification Quest Certification Station"
  >
    <div id="stageWrap">
      <main id="stage">

        <img
          id="certificationStationMaster"
          src="./assets/certification-station-master.png"
          alt="Quantum Certification Quest Certification Station welcome interface"
          draggable="false"
        >

        <svg
          id="qcqStaticMainFrame"
          viewBox="0 0 3840 2160"
          preserveAspectRatio="none"
          aria-hidden="true"
        >
          <defs>
            <mask
              id="qcqMainFrameRingMask"
              maskUnits="userSpaceOnUse"
            >
              <rect
                x="0"
                y="0"
                width="3840"
                height="2160"
                fill="white"
              />

              <rect
                x="145"
                y="145"
                width="3550"
                height="1870"
                rx="36"
                fill="black"
              />

              <rect
                x="1360"
                y="1880"
                width="1120"
                height="280"
                fill="black"
              />
            </mask>
          </defs>

          <image
            href="../assets/master-static-4k.png"
            x="0"
            y="0"
            width="3840"
            height="2160"
            preserveAspectRatio="none"
            mask="url(#qcqMainFrameRingMask)"
          />
        </svg>

        <canvas
          id="historicalBorderPlasma"
          width="960"
          height="540"
          aria-hidden="true"
        ></canvas>

        <div
          id="frameFallbackStatus"
          aria-hidden="true"
        ></div>

      </main>
    </div>
  </div>

  <script src="./certification-station-frame.js"></script>

<!-- QCQ_WELCOME_FRAME_NEST_20260826:BEGIN -->
<img
  id="qcqWelcomeStaticBorder"
  src="./assets/qcq-static-border-no-nameplate.png"
  alt=""
  aria-hidden="true"
/>
<!-- QCQ_WELCOME_FRAME_NEST_20260826:END -->

</body>
</html>
